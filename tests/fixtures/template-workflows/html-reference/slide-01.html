<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 720pt; height: 405pt; font-family: Pretendard, sans-serif; background: #F7F3EA; }
    .frame { position: relative; width: 720pt; height: 405pt; overflow: hidden; }
    .logo { position: absolute; right: 42pt; top: 30pt; color: #173B57; font-weight: 700; }
    h1 { position: absolute; left: 52pt; top: 92pt; width: 420pt; margin: 0; font-size: 34pt; color: #173B57; }
    p { position: absolute; left: 54pt; top: 186pt; width: 360pt; margin: 0; font-size: 15pt; color: #516070; }
    ul { position: absolute; left: 54pt; top: 250pt; width: 370pt; margin: 0; color: #173B57; font-size: 14pt; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="logo">ACME</div>
    <h1 data-template-role="title">Quarterly operating rhythm</h1>
    <p data-template-role="subtitle">Filled sample content reveals real density, hierarchy, and brand behavior.</p>
    <ul data-template-role="bullets">
      <li>Pipeline quality improved in priority regions</li>
      <li>Margin pressure remains concentrated in legacy accounts</li>
      <li>Next quarter focuses on repeatable expansion motions</li>
    </ul>
  </div>
</body>
</html>
